<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shade Queue</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.0.38/dist.min.js"></script>
  <link rel="stylesheet" href="/web/style.css" />
</head>
<body>
  <div id="map"></div>

  <header class="card" id="title">
    <h1>Shade Queue <span class="tag">v0 · Mott Haven</span></h1>
    <p>Per-tree 3D crowns + simulated shade for NYC street trees. Click a tree, or an orange empty pit to plant one.</p>
  </header>

  <section class="card" id="controls">
    <label>Day
      <select id="day">
        <option value="2026-06-21">Summer solstice (Jun 21)</option>
        <option value="2026-09-22">Autumn equinox (Sep 22)</option>
        <option value="2026-03-20">Spring equinox (Mar 20) · leaf-off</option>
        <option value="2026-12-21">Winter solstice (Dec 21) · leaf-off</option>
      </select>
    </label>
    <label>Time <output id="time-label">--</output>
      <input id="hour" type="range" min="0" max="0" step="1" value="0" />
    </label>
    <div class="row">
      <button id="play" type="button">▶ Play</button>
      <label class="inline">Colour <select id="color-mode">
        <option value="source">by crown source</option>
        <option value="hours">by summer shade hours</option>
      </select></label>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="t-bshadow" checked /> building shadows</label>
      <label><input type="checkbox" id="t-tshadow" checked /> tree shadows</label>
      <label><input type="checkbox" id="t-sites" checked /> empty pits</label>
      <label><input type="checkbox" id="t-hvi" /> heat vulnerability</label>
    </div>
    <div id="legend"></div>
    <div id="stats" class="muted"></div>
  </section>

  <aside class="card hidden" id="panel">
    <button id="close" type="button" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <script src="/web/main.js"></script>
</body>
</html>
