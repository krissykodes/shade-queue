[project]
name = "shade-queue"
version = "0.1.0"
description = "Per-tree canopy + shade simulation for NYC street trees (TreeFolio-style), extensible to empty-pit planting scenarios."
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.6",
  "requests>=2.31",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=0.14",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pvlib>=0.10",
  "pandas>=2.1",
  "laspy>=2.5",
  "scikit-image>=0.22",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
